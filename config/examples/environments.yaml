# 多环境配置示例
# 配置文件: config/environments.yaml

version: '1.0'
type: 'environments'

environments:
  # 测试环境
  test:
    name: 测试环境
    base_url: http://test-api.example.com
    description: 用于日常开发和测试
    config:
      timeout: 30
      max_retries: 3
      verify_ssl: false
      default_headers:
        Content-Type: application/json
        X-Test-Mode: "true"
  
  # 预发布环境
  staging:
    name: 预发布环境
    base_url: http://staging-api.example.com
    description: 上线前最终验证
    config:
      timeout: 30
      max_retries: 2
      verify_ssl: true
      default_headers:
        Content-Type: application/json
  
  # 生产环境
  prod:
    name: 生产环境
    base_url: https://api.example.com
    description: 生产环境（谨慎操作，需要特殊权限）
    config:
      timeout: 60
      max_retries: 3
      verify_ssl: true
      default_headers:
        Content-Type: application/json
        Authorization: "Bearer ${ENV_API_TOKEN}"
